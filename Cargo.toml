[package]
name = "git-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Git helpers for ending a coding session: update main, remove merged worktrees, and prune merged branches."
license = "MIT"
repository = "https://github.com/nb-twy/git-kit"
homepage = "https://github.com/nb-twy/git-kit"
readme = "README.md"
keywords = ["git", "worktree", "branch", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
