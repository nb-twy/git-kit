name: Release on version bump

# Merging a PR that moves the version in Cargo.toml to one with no tag yet
# releases that version. Merges that leave the version alone release nothing.
#
# The Release workflow (generated by cargo-dist) builds the artifacts, creates
# the tag on this commit, and publishes the GitHub release. It is started with
# workflow_dispatch because a tag pushed with this workflow's token would not
# trigger another workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write # to start the Release workflow

concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Release the version in Cargo.toml if it has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "git-kit") | .version')
          tag="v$version"

          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi

          # A release still building has not created its tag yet. Starting a
          # second one would race it to publish the same version.
          running=$(gh run list --workflow release.yml --event workflow_dispatch \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" -gt 0 ]; then
            echo "::notice::A release is already in progress; not starting another for $tag."
            exit 0
          fi

          gh workflow run release.yml --ref main -f tag="$tag"
          echo "::notice::Started the release of $tag."
